name: ci
on:
  push:
    branches: [main, 'page/**', 'feat/**']
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Generated-tree cleanliness
        run: git diff --exit-code
      - name: Retain local-action execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: p2c-local-action-${{ matrix.os }}
          path: evidence/local/p2c*
          if-no-files-found: error

  gateway:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/context-gateway/requirements.txt
      - run: python -m unittest discover tests -v
        working-directory: packages/context-gateway
