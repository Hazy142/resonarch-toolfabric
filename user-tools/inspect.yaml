schema: resonarch.toolfabric.user-tool/v1
id: inspect
version: 1.0.0
intent: Compile the inspect user intent into a provider-independent execution DAG.
preflight:
  - instructions.discover
  - git.status
required_capabilities: []
graph:
  - instructions.discover
  - instructions.resolve
  - git.status
  - fs.list
  - fs.search
  - code.symbols
  - code.dependencies
  - test.discover
  - context.pack
  - report.render
required_gates:
  - receipt_chain_valid
failure_routes:
  - blocked
  - denied
  - uncertain
  - budget_exhausted
default_budget:
  tool_calls: 64
  wall_seconds: 3600
completion:
  require:
    - evidence_bound_to_current_scope
    - no_open_uncertain_side_effects
